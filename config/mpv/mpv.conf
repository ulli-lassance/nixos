### Profile ###
include="~~/profiles.conf"

### Video ###
vo=gpu-next                                     # Video output driver
hwdec=auto                                      # Enables hardware decoding.
gpu-api=vulkan                                  # Sets the graphics API to Vulkan, often preferred on Linux for performance.
deinterlace=auto                                # Automatically detects and removes interlacing artifacts (scan lines) from video.

deband=no                                       # Disables the debanding filter by default.
deband-iterations=1                             # Number of times the debanding filter is applied. More iterations mean a stronger effect.
deband-threshold=48                             # The threshold for detecting banding. Higher values are more aggressive in what they consider banding.
deband-range=32                                 # The spatial range of the debanding filter in pixels.
deband-grain=32                                 # Adds a small amount of grain to help mask any remaining banding.

# video-sync=display-resample                   # See: https://github.com/mpv-player/mpv/wiki/Display-synchronization
tscale=oversample                               # Filter option for temporal axis (frames) interpolation.

### Audio and Subtitles ###
slang=en,eng,English                            # Sets the preferred subtitle language priority to English.
alang=ja,jp,jpn,jap,Japanese,en,eng,English     # Sets the preferred audio language priority.

sub-blur=0.5                                    # Applies a slight blur to subtitle edges to make them less sharp.
sub-gauss=1.5                                   # Applies a Gaussian blur to subtitles for a softer look.
sub-scale=1                                     # Scales subtitles relative to the video frame height.
sub-margin-y=60                                 # Sets the vertical margin (distance) of subtitles from the bottom of the screen.
sub-color='#ffffffff'                         # Sets the main subtitle text color.
sub-shadow-offset=0                             # Sets the distance of the subtitle shadow. 0 means no shadow is visible.
sub-outline-size=1.15                           # Sets the thickness of the text outline (border).
sub-font='Clear Sans Bold'                      # Specifies the font to use for plain text subtitles (like .srt).
sub-back-color='#1e1e2e'                      # Sets the background color for the subtitle bounding box.
sub-border-color='#1e1e2e'                    # Sets the color for the text border (legacy, often replaced by outline).
sub-shadow-color='#1e1e2e'                    # Sets the color of the text shadow.
sub-outline-color='#1e1e2e'                   # Sets the color of the text outline.

sub-auto=all                                    # Automatically loads all external subtitle files in the media folder.
volume=30                                       # Sets the default starting volume.
volume-max=200                                  # Sets the maximum possible volume.
sub-fix-timing=yes                              # Attempts to automatically fix gaps and timing issues in subtitles.
blend-subtitles=yes                             # Renders subtitles directly onto the video frames.
sub-ass-override=yes                            # Forces your custom styles on styled subtitles (.ass/.ssa).
demuxer-mkv-subtitle-preroll=yes                # Helps prevent styled subtitles in MKV files from appearing late.
sub-file-paths=sub;subs;subtitles               # Defines the exact subdirectories to search for subtitles.

osc=no                                          # Disables the default On-Screen Controller (the bottom progress bar).
border=no                                       # Removes the window's title bar and borders for a cleaner look.
cursor-autohide=1000                            # The mouse cursor will automatically hide after set milliseconds of inactivity.
osd-level=1                                     # Sets the On-Screen Display to show basic information (like seek time).

### OSD ###
osd-bar=no                                      # Disables the default OSD progress bar that appears on seek/pause.
osd-bold=yes                                    # Makes OSD text bold.
osd-font-size=37                                # Sets the font size for OSD text (e.g., volume level, seek time).
osd-font='JetBrains Mono'                       # Sets the font for OSD text.
osd-duration=1000                               # Sets how long OSD messages stay on screen.

### SCREENSHOT ###
screenshot-format=png                           # Screenshot format.
screenshot-high-bit-depth=no                    # Use the same bit depth as the video for screenshots.
screenshot-tag-colorspace=no                    # Apply video's color conversion (tonemapping) to the screenshot.
screenshot-png-compression=2                    # PNG compression level (0-9). Lower is faster with larger files.
screenshot-dir="~/Pictures/Screenshots"         # Directory to save screenshots.
screenshot-template="%{?demuxer-via-network==yes:${media-title}%{?demuxer-via-network==yes:_${filename/no-ext}%{!demuxer-via-network==yes:${filename}-%wH.%wM.%wS.%wT-#%#00n"

### CACHE ###
cache=yes
cache-pause=no                                  # Don't pause playback to fill the cache
demuxer-max-bytes=500M                          # Use up to 500MB of RAM for the cache
demuxer-max-back-bytes=100M                     # Keep 100MB of cache behind the current time